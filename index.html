<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CD Tracker</title>
<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --ink:#1c2430; --muted:#6b7684;
    --line:#dfe4ea; --accent:#2f5d8a; --accent-soft:#e7eef6;
    --ok:#1f7a4d; --warn:#8a4b1f; --warn-bg:#fbeede;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.4;padding:24px 16px 60px;
  }
  .wrap{max-width:900px;margin:0 auto}
  header{margin-bottom:16px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px}
  #status{margin:14px 0;padding:12px 14px;border-radius:10px;font-size:13px;
    background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);}
  #status.warn{background:var(--warn-bg);color:var(--warn);border-color:#ecd8bf}
  #status.ok{background:#e4f3ea;color:var(--ok);border-color:#cfe7d8}

  .list{display:block}
  .plant{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;
  }
  .rowline{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .pnum{
    font-size:18px;font-weight:700;letter-spacing:1px;
    width:60px;flex:0 0 60px;padding-bottom:8px;
  }
  .field{display:flex;flex-direction:column}
  .field label{font-size:11px;color:var(--muted);margin-bottom:3px}
  .f-name{flex:1 1 180px;min-width:150px}
  .f-code{flex:0 0 90px}
  .f-date{flex:0 0 160px}
  input,select{
    width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  button.save{
    padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;
    font-size:14px;font-weight:600;cursor:pointer;height:37px;
  }
  button.save:hover{background:#26496c}
  button.save:disabled{background:#a9b6c4;cursor:not-allowed}

  .entries{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-left:70px}
  .entry{
    display:flex;align-items:center;gap:8px;font-size:13px;
    background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:6px 9px;
  }
  .entry .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .code{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:20px;font-weight:600}
  .entry .date{color:var(--muted);font-variant-numeric:tabular-nums}
  .entry .del{border:0;background:transparent;color:var(--muted);cursor:pointer;
    font-size:16px;line-height:1;padding:2px 4px;border-radius:6px;}
  .entry .del:hover{background:#eee;color:#b23b3b}
  .empty{font-size:12px;color:var(--muted);font-style:italic;margin-top:8px;padding-left:70px}

  @media(max-width:560px){
    .pnum{width:100%;flex:0 0 100%;padding-bottom:0}
    .entries,.empty{padding-left:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CD Tracker</h1>
    <div class="sub">Plant on the left, then name / code / date. Save to share with everyone. <b>v3</b></div>
  </header>

  <div id="status">Connecting...</div>

  <div class="list" id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, remove, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ============================================================
   1) FIREBASE CONFIG - paste your own project details here
   Firebase Console > Project settings > General > Your apps > </>
   ============================================================ */
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE.firebaseapp.com",
  databaseURL: "https://cdchecks-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "PASTE",
  storageBucket: "PASTE.appspot.com",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};

/* 2) PLANT NUMBERS - fixed */
const PLANTS = ["4392","4133","4138","4015","2172","2690","2900",
                "8061","8072","8119","8145","8165","8201","8249"];

const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");

if (firebaseConfig.apiKey === "PASTE_API_KEY") {
  statusEl.className = "warn";
  statusEl.textContent =
    "Firebase config missing. Fill in the firebaseConfig block in the script to enable shared visibility. (Saving is disabled until then.)";
}

let db = null;
try {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  if (firebaseConfig.apiKey !== "PASTE_API_KEY") {
    statusEl.className = "ok";
    statusEl.textContent = "Connected. Entries appear instantly for all users.";
  }
} catch (e) {
  statusEl.className = "warn";
  statusEl.textContent = "Could not connect to Firebase: " + e.message;
}

const today = () => new Date().toISOString().slice(0,10);

const listEls = {};
for (const p of PLANTS) {
  const card = document.createElement("div");
  card.className = "plant";
  card.innerHTML = `
    <div class="rowline">
      <div class="pnum">${p}</div>
      <div class="field f-name">
        <label>Name</label>
        <input type="text" data-name placeholder="Name">
      </div>
      <div class="field f-code">
        <label>Code</label>
        <select data-code>
          <option value="0.5">0.5</option>
          <option value="0.75">0.75</option>
        </select>
      </div>
      <div class="field f-date">
        <label>Date</label>
        <input type="date" data-date value="${today()}">
      </div>
      <button class="save">Save</button>
    </div>
    <div class="entries" data-entries></div>
    <div class="empty" data-empty>No entries yet.</div>`;
  listEl.appendChild(card);

  const nameEl = card.querySelector("[data-name]");
  const codeEl = card.querySelector("[data-code]");
  const dateEl = card.querySelector("[data-date]");
  const btn    = card.querySelector(".save");
  listEls[p]   = { entries: card.querySelector("[data-entries]"),
                   empty: card.querySelector("[data-empty]") };

  btn.addEventListener("click", async () => {
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }
    if (!db) { alert("Firebase config not filled in, cannot save."); return; }
    btn.disabled = true;
    try {
      await push(ref(db, "kayitlar/" + p), {
        isim: name, kod: codeEl.value, tarih: dateEl.value || today(), ts: Date.now()
      });
      nameEl.value = "";
    } catch (e) { alert("Could not save: " + e.message); }
    btn.disabled = false;
  });
}

function render(plant, data) {
  const box = listEls[plant].entries;
  const empty = listEls[plant].empty;
  box.innerHTML = "";
  const rows = Object.entries(data || {}).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  empty.style.display = rows.length ? "none" : "block";
  for (const [key,r] of rows) {
    const el = document.createElement("div");
    el.className = "entry";
    el.innerHTML = `<span class="name"></span><span class="code"></span><span class="date"></span><button class="del" title="Delete">&times;</button>`;
    el.querySelector(".name").textContent = r.isim || "";
    el.querySelector(".code").textContent = r.kod || "";
    el.querySelector(".date").textContent = r.tarih || "";
    el.querySelector(".del").addEventListener("click", () => {
      if (confirm("Delete this entry?")) remove(ref(db, "kayitlar/" + plant + "/" + key));
    });
    box.appendChild(el);
  }
}

if (db) {
  for (const p of PLANTS) onValue(ref(db, "kayitlar/" + p), snap => render(p, snap.val()));
}
</script>
</body>
</html>
